<h1 class="text-3xl bg-pink-300">Contextual for loops types</h1>
@for(user of users; track user;){
@if($even)
{
<h3 class="text-2xl bg-orange-300">user no {{$index}} and name is {{user}}</h3>
}
@if($odd)
{
<h3 class="text-2xl bg-cyan-600">user no {{$index}} and name is {{user}}</h3>
}}

<h1 class="text-3xl bg-pink-700">Two way binding</h1>
<input type="text" [(ngModel)]="userName" placeholder="enter your name" class="border-2">
<h1 class="text-4xl bg-emerald-700 text-white">{{userName}}</h1>
